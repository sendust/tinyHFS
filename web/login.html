<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>{{HOSTNAME}} · tinyHFS by sendust {{VERSION}}</title>
<script>try{const t=localStorage.getItem('tinyhfs.theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--fg:#1d2330;--muted:#6b7280;--line:#e2e5ea;--acc:#2563eb;--err:#dc2626;--hl:#e8effd}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#13161b;--panel:#1b1f26;--fg:#e5e7eb;--muted:#9aa3af;--line:#2b313a;--acc:#60a5fa;--err:#f87171;--hl:#1e2b40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161b;--panel:#1b1f26;--fg:#e5e7eb;--muted:#9aa3af;--line:#2b313a;--acc:#60a5fa;--err:#f87171;--hl:#1e2b40;color-scheme:dark}
:root[data-theme="pink"]{--bg:#fff0f6;--panel:#ffffff;--fg:#4a1d35;--muted:#a0607f;--line:#f8c8dc;--acc:#d6336c;--err:#c92a2a;--hl:#ffdeeb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font:14px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg)}
form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 24px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12px;margin:2px 0 16px}
.host{display:flex;align-items:center;gap:8px;margin:0 0 18px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:13px}
.host span{color:var(--muted)}
.host b{font-weight:600;word-break:break-all}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;padding:9px;border:0;border-radius:7px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:10px}

button.thm{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;font-size:16px;line-height:1;border:1px solid var(--line);border-radius:7px;background:var(--panel);transition:transform .15s}
button.thm:hover{border-color:var(--acc)}
button.thm:active{transform:scale(.9)}
body>button.thm{position:fixed;top:12px;right:12px}
</style>
</head>
<body>
<button type="button" class="thm" id="thm" title="Theme">☀️</button>
<form id="f">
  <h1>tinyHFS</h1>
  <div class="sub">by sendust · [{{VERSION}}]</div>
  <div class="host" title="Server host name">🖥 <span>Host</span> <b>{{HOSTNAME}}</b></div>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus required>
  <button id="b">Log in</button>
  <div class="err" id="err"></div>
</form>
<script>
'use strict';
document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'),err=document.getElementById('err'),pw=document.getElementById('pw');
  b.disabled=true;err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){location.href='/'+location.hash;return}
    err.textContent=j.error||('error '+r.status);pw.select();
  }catch(e){err.textContent=e.message}
  b.disabled=false;
};

// theme button (light -> dark -> pink), shared by all tinyHFS pages via localStorage
(()=>{const r=document.documentElement,b=document.getElementById('thm');if(!b)return;const mq=matchMedia('(prefers-color-scheme: dark)');
  const T=['light','dark','pink'],ICON={light:'☀️',dark:'🌙',pink:'🌸'},NAME={light:'Light',dark:'Dark',pink:'Pink'};
  const eff=()=>T.includes(r.dataset.theme)?r.dataset.theme:(mq.matches?'dark':'light');
  const upd=()=>{const t=eff(),n=T[(T.indexOf(t)+1)%T.length];b.textContent=ICON[t];b.title=`Theme: ${NAME[t]} — click for ${NAME[n]}`};
  b.addEventListener('click',ev=>{ev.preventDefault();const n=T[(T.indexOf(eff())+1)%T.length];r.dataset.theme=n;try{localStorage.setItem('tinyhfs.theme',n)}catch{}upd()});
  mq.addEventListener('change',upd);upd()})();
</script>
</body>
</html>
